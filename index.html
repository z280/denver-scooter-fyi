<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0d1b2a" />
    <meta
      name="description"
      content="Live interactive map of every Denver Veo scooter and e-bike, with disadvantaged-area overlays and daily compliance status."
    />
    <title>Denver Veo Scooter &amp; E-Bike Map</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🛴%3C/text%3E%3C/svg%3E" />
  </head>
  <body>
    <a class="skip-link" href="#controls-panel">Skip to map controls</a>

    <div id="map" role="application" aria-label="Map of Denver Veo scooters and e-bikes"></div>

    <!-- Mobile controls toggle (hamburger) -->
    <button
      id="controls-toggle"
      class="controls-toggle"
      aria-expanded="false"
      aria-controls="controls-panel"
      aria-label="Open map filters and layers"
    >
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="3" y1="6" x2="21" y2="6" /><line x1="3" y1="12" x2="21" y2="12" /><line x1="3" y1="18" x2="21" y2="18" />
      </svg>
      <span>Filters</span>
    </button>

    <!-- Left controls panel -->
    <aside id="controls-panel" class="controls-panel" aria-label="Map filters and layers">
      <header class="panel-header">
        <h1 class="panel-title">Denver Veo Live Map</h1>
        <button id="controls-close" class="panel-close" aria-label="Close panel">&times;</button>
      </header>

      <section class="control-group" aria-labelledby="device-filter-label">
        <h2 id="device-filter-label" class="control-label">Device type</h2>
        <div class="segmented" role="radiogroup" aria-labelledby="device-filter-label">
          <button class="seg-btn is-active" role="radio" aria-checked="true" data-filter="all">All</button>
          <button class="seg-btn" role="radio" aria-checked="false" data-filter="scooter">Scooters</button>
          <button class="seg-btn" role="radio" aria-checked="false" data-filter="bicycle">E-bikes</button>
        </div>
      </section>

      <section class="control-group" aria-labelledby="layers-label">
        <h2 id="layers-label" class="control-label">Overlays</h2>
        <ul class="layer-list" id="layer-list">
          <!-- populated by JS -->
        </ul>
      </section>

      <section class="control-group" aria-labelledby="choropleth-label">
        <h2 id="choropleth-label" class="control-label">Color regions by device density</h2>
        <select id="choropleth-select" class="select" aria-labelledby="choropleth-label">
          <option value="">Off</option>
          <option value="v1">Disadvantaged Areas (v1)</option>
          <option value="v2">Disadvantaged Areas (v2)</option>
          <option value="neighborhood">Neighborhoods</option>
          <option value="council_district">City Council Districts</option>
          <option value="community_network">City Regions</option>
        </select>
        <div id="choropleth-legend" class="legend" hidden></div>
      </section>

      <section class="control-group" aria-labelledby="search-label">
        <h2 id="search-label" class="control-label">Find a neighborhood</h2>
        <input
          id="neighborhood-search"
          class="select"
          list="neighborhood-options"
          placeholder="Type a neighborhood…"
          aria-labelledby="search-label"
          autocomplete="off"
        />
        <datalist id="neighborhood-options"></datalist>
        <button id="neighborhood-clear" class="text-btn" hidden>Clear highlight</button>
      </section>

      <footer class="panel-footer">
        <p>
          Data: <a href="https://data.scooter.fyi" rel="noopener">data.scooter.fyi</a>.
          Positions refresh every 90s.
        </p>
      </footer>
    </aside>

    <!-- Compliance gauge (top-right) -->
    <div id="compliance" class="compliance" role="status" aria-live="polite" aria-label="Daily compliance status">
      <div class="compliance-loading">Loading compliance…</div>
    </div>

    <!-- Freshness footer (bottom-right) -->
    <div id="freshness" class="freshness" role="status" aria-live="polite">
      <span class="freshness-dot" aria-hidden="true"></span>
      <span id="freshness-text">Connecting…</span>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
