<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shot harness</title>
<link rel="stylesheet" href="/src/style.css">
<style>
  body { margin: 0; background: var(--bg, #f6f7f9); }
  .shot { width: 412px; margin: 0 auto; padding: 12px; box-sizing: border-box; }
  .shot h2 { font: 700 13px/1.3 system-ui; margin: 0 0 8px; opacity: .6; }
  .drawer { position: static !important; display: block !important;
            transform: none !important; visibility: visible !important;
            opacity: 1 !important; width: auto !important; height: auto !important;
            max-height: none !important; }
  #navhud { position: relative; height: 520px; background: #cfd8e3; overflow: hidden; }
</style>
</head><body>
<div class="shot" id="nav-prefs"><h2>Navigation preferences — Calling dibs</h2>
  <aside class="drawer is-open"><div class="drawer__body" id="navprefs-host"></div></aside></div>
<div class="shot" id="trip"><h2>Your trip — Clear my trip</h2>
  <aside class="drawer is-open"><div class="drawer__body" id="trip-host"></div></aside></div>
<div class="shot" id="trip2"><h2>Your trip — the confirm</h2>
  <aside class="drawer is-open"><div class="drawer__body" id="trip-host-2"></div></aside></div>
<div class="shot" id="hud"><h2>Directions — a magnifier per step</h2>
  <div id="navhud"></div></div>
<script type="module" src="/scripts/shots/harness.ts"></script>
</body></html>
