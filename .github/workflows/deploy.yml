name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-flight run when a newer commit lands on the same ref.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # tsc --noEmit + vite build. Fails the run on any type error.
      # VITE_* vars are baked in at BUILD time — this site builds here and
      # only uploads dist/ to Pages (Direct Upload), so Pages-dashboard env
      # vars never apply. The Google client id must live in this repo's
      # Actions secrets/variables (Settings -> Secrets and variables ->
      # Actions, name: VITE_GOOGLE_CLIENT_ID). It's a public identifier
      # (it ships in the JS bundle), so a repo Variable is fine too.
      - run: npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID || vars.VITE_GOOGLE_CLIENT_ID }}

      # Vitest (ride-mode phase F1). Offline — every suite stubs fetch and web
      # storage — so this needs no secrets and no network.
      - run: npm test

      # tests/fixtures/track-chain-vectors.json is a cross-repo byte contract:
      # the same file, byte-identical, backs the API repo's track_verify tests.
      # This re-derives it from scripts/gen-track-vectors.mjs and fails if a
      # single byte drifted (a hand-edit, an editor reformat), so the two repos
      # cannot silently desynchronise.
      - run: npm run vectors:check

      # Direct Upload of dist/. Push to main -> production deploy. A PR deploys
      # to a stable per-PR preview URL. The --branch value is built only from
      # the PR number (an integer) and the literal "main", never from the
      # branch name, so there is no shell-injection surface.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy dist
            --project-name=denver-scooter-fyi
            --branch=${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'main' }}
